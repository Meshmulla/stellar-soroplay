# Fixed project manifest for every compile request. Users only supply
# src/lib.rs — they cannot add dependencies or build scripts, which keeps the
# compile-time attack surface limited to the trusted soroban-sdk macros.
[package]
name = "soroplay-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "soroplay_contract"
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
